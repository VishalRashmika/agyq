name: Release & APT Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build, Release & Publish APT
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        if: env.CLOUDSMITH_API_KEY != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}

      - name: Install Cloudsmith CLI
        if: env.CLOUDSMITH_API_KEY != ''
        run: pip install --upgrade cloudsmith-cli
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}

      - name: Push .deb packages to Cloudsmith APT repository
        if: env.CLOUDSMITH_API_KEY != ''
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          CLOUDSMITH_ORG: ${{ vars.CLOUDSMITH_ORGANIZATION }}
        run: |
          # 1. Resolve Cloudsmith namespace / owner (default to 'agyq')
          OWNER="${CLOUDSMITH_ORG:-agyq}"
          echo "Target Cloudsmith organization/owner: $OWNER"

          # 2. Ensure repository 'agyq' exists under the owner
          echo "Ensuring public repository 'agyq' exists in Cloudsmith namespace '$OWNER'..."
          cat << 'EOF' > /tmp/repo-config.json
          {
            "name": "agyq",
            "description": "APT and package repository for agyq",
            "repository_type_str": "Public",
            "slug": "agyq"
          }
          EOF

          cloudsmith repos create "$OWNER" /tmp/repo-config.json 2>&1 || true

          # 3. Upload .deb packages
          shopt -s nullglob
          deb_files=(dist/*.deb dist/*/*.deb)
          if [ ${#deb_files[@]} -eq 0 ]; then
            echo "No .deb packages found in dist/"
            exit 1
          fi

          for deb in "${deb_files[@]}"; do
            echo "Pushing $deb to $OWNER/agyq/any-distro/any-version..."
            cloudsmith push deb "$OWNER/agyq/any-distro/any-version" "$deb" --no-wait-for-sync
          done
